[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixels-alone-provenance"
version = "0.1.0"
description = "Experiments for Can Pixels Alone Reveal Image Origin?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "Pillow>=10.0",
  "torch>=2.3",
  "torchvision>=0.18",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "open-clip-torch>=2.26.1",
]

[project.urls]
Repository = "https://github.com/kaikaiyao/pixels-alone-provenance"

[project.optional-dependencies]
test = ["pytest>=8.0"]
generation = [
  "diffusers>=0.30.0",
  "transformers>=4.45",
  "accelerate>=0.33",
  "huggingface-hub>=0.24",
  "safetensors>=0.4",
  "tiktoken>=0.8",
  "sentencepiece>=0.2.0",
  "protobuf>=5.28",
]
perceptual = ["lpips>=0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
